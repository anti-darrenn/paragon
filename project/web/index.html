<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` argument to `flutter build`. Must start
    and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Paragon</title>
  <meta name="description" content="Practise WAEC past questions and learn topic by topic: Mathematics, Physics, Further Mathematics, Chemistry and Government.">
  <meta name="theme-color" content="#0D1117">

  <!-- Link previews (WhatsApp, iMessage, social). og:image must be an
       absolute URL: most crawlers ignore a relative one. The icons and
       this image come from tool/make_icons.dart. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Paragon">
  <meta property="og:title" content="Paragon: WAEC prep, topic by topic">
  <meta property="og:description" content="Practise WAEC past questions and learn topic by topic: Mathematics, Physics, Further Mathematics, Chemistry and Government.">
  <meta property="og:url" content="https://paragon-hq.web.app/">
  <meta property="og:image" content="https://paragon-hq.web.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Project Paragon">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paragon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    First load is ~3.5 MB gzipped (main.dart.js ~1.5 MB, CanvasKit ~2 MB from
    gstatic), measured 2026-10-03 — see docs/audit/PERF.md. Start the
    connections and the app download now instead of after flutter_bootstrap.js
    runs: on 3G each new TLS handshake costs most of a second.
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preload" href="main.dart.js" as="script">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    No MathJax here. Maths renders through flutter_math_fork on the canvas;
    a MathJax script in this file was 1.2 MB of render-blocking download
    that nothing used. See docs/LATEX_RENDERING.md.
  -->

  <!--
    Loading splash, shown while main.dart.js and CanvasKit download (several
    MB — long on a 3G connection). Pure CSS, no extra requests. Colours are
    AppColors.backgroundDark and AppColors.primary. Removed on Flutter's
    first frame by the listener below.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0D1117; }
    #splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #0D1117;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #splash .word { color: #FF7700; font-size: 28px; font-weight: 700; letter-spacing: .02em; }
    #splash .pitch { max-width: 420px; padding: 0 24px; text-align: center; color: #E6EDF3; }
    #splash h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
    #splash p { font-size: 15px; line-height: 1.5; margin: 0; color: #8B949E; }
    #splash .slow { font-size: 13px; color: #8B949E; opacity: 0; transition: opacity .4s ease; }
    #splash .slow.show { opacity: 1; }
    #splash .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #30363D; border-top-color: #FF7700;
      animation: splash-spin .9s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spin { animation-duration: 3s; } }
  </style>
</head>
<body>
  <!--
    The splash doubles as a landing page: on a slow connection a student
    reads it for 10-20 seconds, so it says what Paragon is rather than only
    spinning. Plain HTML, so link-preview and search crawlers read it too.
  -->
  <div id="splash" aria-live="polite">
    <div class="word">Paragon</div>
    <div class="pitch">
      <h1>Free WAEC prep, one topic at a time</h1>
      <p>Lessons, practice and full timed past papers in Mathematics, Physics,
        Further Mathematics, Chemistry and Government.</p>
    </div>
    <div class="spin" role="progressbar" aria-label="Loading Paragon"></div>
    <div class="slow" id="splash-slow">Still loading. The first visit is the slowest; next time it opens much faster.</div>
  </div>
  <noscript>
    <p style="color:#E6EDF3;text-align:center;font-family:system-ui,sans-serif;padding:24px">
      Paragon needs JavaScript turned on to run.</p>
  </noscript>
  <script>
    setTimeout(function () {
      var slow = document.getElementById('splash-slow');
      if (slow) slow.className = 'slow show';
    }, 6000);
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
