# Nightly Paragon maintenance.
#
# Replaces the scheduled Cloud Functions we would otherwise need Blaze
# for. The Admin SDK bypasses security rules and runs fine from CI, so
# the only thing Cloud Functions was providing here was a cron.
#
# Requires one repository secret:
#   FIREBASE_SERVICE_ACCOUNT — the full service account JSON, as text.
# It grants full admin access; keep it in secrets, never in the repo.
name: maintenance

on:
  schedule:
    # 02:30 UTC = 03:30 WAT, comfortably off-peak for Nigerian students.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually write changes (otherwise dry run)'
        type: boolean
        default: false

# Read-only unless a job says otherwise. Every third-party action is
# pinned to a commit, not a tag a compromised upstream could move; the
# comment names the tag it was taken from. Installs use `npm ci
# --ignore-scripts`: the lockfile exactly, and no dependency's install
# script runs next to the secrets (the repository is public).
permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install
        working-directory: project/tools/admin
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Scheduled runs always apply. A manual run defaults to a dry run so
      # the workflow can be exercised safely from the Actions tab.
      - name: Run jobs
        working-directory: project/tools/admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            node jobs.js --job=all --apply
          else
            node jobs.js --job=all
          fi
