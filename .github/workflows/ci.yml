# Checks every pull request (PLAN.md P6.3). Until this, nothing ran
# `flutter analyze` or `flutter test` except by hand, and the rules were
# only ever tested after a deploy.
#
# Jobs:
#   app      analyze, test, release build + post-build (fonts, static pages)
#   node     the admin and site scripts' own tests
#   rules    firestore.rules on the emulator (Java is on the runner, not
#            on the dev machine — that is why this lives here)
#   content  live checks against production, read-only, when the
#            FIREBASE_SERVICE_ACCOUNT secret is available
#   preview  deploys the build to a Hosting preview channel and comments
#            the URL. Live deploys stay manual: the owner runs them.
#
# Firestore reads: `content` costs ~250 (lint + counts). The static pages
# read ~4,500 documents, and only on a push to main (cached by ISO week,
# which pull requests can then reuse). A pull request never reads them
# from Firestore; see the post-build step.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise. Every third-party action is
# pinned to a commit, not a tag a compromised upstream could move; the
# comment names the tag it was taken from. Installs use `npm ci
# --ignore-scripts`: the lockfile exactly, and no dependency's install
# script runs next to the secrets (the repository is public).
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release build
        run: flutter build web --release
      # The same check CLAUDE.md asks for by hand: production once shipped
      # without the YouTube and shared_preferences web plugins.
      - name: Plugin registrant is complete
        run: |
          n=$(cat .dart_tool/flutter_build/*/web_plugin_registrant.dart | grep -c "WebYoutubePlayer\|SharedPreferencesPlugin")
          echo "registrant matches: $n"
          test "$n" -ge 2
      # The first download. 4.75 MB unpacked after the rarely used screens
      # were deferred (audit F1); this fails the build if it creeps back.
      # Raise the budget on purpose, in the same PR as the reason.
      - name: Main bundle size budget
        run: |
          size=$(stat -c %s build/web/main.dart.js)
          echo "main.dart.js: $size bytes"
          test "$size" -le 5000000

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Week key for the static-page cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: project/tools/site/.cache
          key: static-site-${{ steps.week.outputs.key }}
      - name: Post-build (fonts; static pages when credentials allow)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          (cd tools/admin && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tools/site && npm ci --ignore-scripts --no-audit --no-fund)
          # A cold cache costs ~4,500 Firestore reads. On 2026-10-15 a day of
          # pull-request runs spent most of Spark's 50k and took the live app
          # down until the quota reset. So only a push to main reads Firestore
          # here; a pull request uses main's warm cache or skips the pages.
          if [ -f tools/site/.cache/data.json ] || { [ "${{ github.event_name }}" = "push" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; }; then
            node tools/site/build_static_site.js
          else
            node -e "const {trimFonts}=require('./tools/site/trim_fonts');console.log(trimFonts('build/web'))"
            echo "No credentials: static pages skipped."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: project/build/web
          retention-days: 3

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Admin scripts
        working-directory: project/tools/admin
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for t in *.test.js; do node "$t"; done
      - name: Static site
        working-directory: project/tools/site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for t in *.test.js; do node "$t"; done

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Rules on the emulator
        working-directory: project/tools/rules-test
        # With install scripts: the emulator tooling builds a native module,
        # and this job holds no secrets.
        run: |
          npm ci --no-audit --no-fund
          npm test

  # Reports problems in *live data* (a placeholder still published, counts
  # out of step until the nightly job runs) — real, but not caused by the
  # code under review, so it shows red without blocking the merge.
  content:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Lint live content and check counts
        working-directory: project/tools/admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret; skipping live checks."
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          node content_lint.js
          node check_counts.js

  preview:
    if: github.event_name == 'pull_request'
    needs: [app]
    runs-on: ubuntu-latest
    # The service account must hold Firebase Hosting Admin for this to
    # work; until it does, a failure here is reported but never blocks.
    continue-on-error: true
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-build
          path: project/build/web
      - name: Deploy to a preview channel
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: paragon-hq
          entryPoint: project
          expires: 7d
