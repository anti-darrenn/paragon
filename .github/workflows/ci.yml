# Checks every pull request (PLAN.md P6.3). Until this, nothing ran
# `flutter analyze` or `flutter test` except by hand, and the rules were
# only ever tested after a deploy.
#
# Jobs:
#   app      analyze, test, release build + post-build (fonts, static pages)
#   node     the admin and site scripts' own tests
#   rules    firestore.rules on the emulator (Java is on the runner, not
#            on the dev machine — that is why this lives here)
#   content  live checks against production, read-only, when the
#            FIREBASE_SERVICE_ACCOUNT secret is available
#   preview  deploys the build to a Hosting preview channel and comments
#            the URL. Live deploys stay manual: the owner runs them.
#
# Firestore reads: `content` costs ~250 (lint + counts). The static pages
# read ~4,500 documents once, then come from a cache keyed by ISO week, so
# a busy week of pull requests reads them once.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release build
        run: flutter build web --release
      # The same check CLAUDE.md asks for by hand: production once shipped
      # without the YouTube and shared_preferences web plugins.
      - name: Plugin registrant is complete
        run: |
          n=$(cat .dart_tool/flutter_build/*/web_plugin_registrant.dart | grep -c "WebYoutubePlayer\|SharedPreferencesPlugin")
          echo "registrant matches: $n"
          test "$n" -ge 2
      # The first download. 4.75 MB unpacked after the rarely used screens
      # were deferred (audit F1); this fails the build if it creeps back.
      # Raise the budget on purpose, in the same PR as the reason.
      - name: Main bundle size budget
        run: |
          size=$(stat -c %s build/web/main.dart.js)
          echo "main.dart.js: $size bytes"
          test "$size" -le 5000000

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Week key for the static-page cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: project/tools/site/.cache
          key: static-site-${{ steps.week.outputs.key }}
      - name: Post-build (fonts; static pages when credentials allow)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          (cd tools/admin && npm install --no-audit --no-fund)
          (cd tools/site && npm install --no-audit --no-fund)
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || [ -f tools/site/.cache/data.json ]; then
            node tools/site/build_static_site.js
          else
            node -e "const {trimFonts}=require('./tools/site/trim_fonts');console.log(trimFonts('build/web'))"
            echo "No credentials: static pages skipped."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: project/build/web
          retention-days: 3

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Admin scripts
        working-directory: project/tools/admin
        run: |
          npm install --no-audit --no-fund
          for t in *.test.js; do node "$t"; done
      - name: Static site
        working-directory: project/tools/site
        run: |
          npm install --no-audit --no-fund
          node render.test.js

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rules on the emulator
        working-directory: project/tools/rules-test
        run: |
          npm install --no-audit --no-fund
          npm test

  # Reports problems in *live data* (a placeholder still published, counts
  # out of step until the nightly job runs) — real, but not caused by the
  # code under review, so it shows red without blocking the merge.
  content:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint live content and check counts
        working-directory: project/tools/admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret; skipping live checks."
            exit 0
          fi
          npm install --no-audit --no-fund
          node content_lint.js
          node check_counts.js

  preview:
    if: github.event_name == 'pull_request'
    needs: [app]
    runs-on: ubuntu-latest
    # The service account must hold Firebase Hosting Admin for this to
    # work; until it does, a failure here is reported but never blocks.
    continue-on-error: true
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: project/build/web
      - name: Deploy to a preview channel
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: paragon-hq
          entryPoint: project
          expires: 7d
